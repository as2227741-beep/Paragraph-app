<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio — Text Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">Folio</div>
  <div class="header-actions">
    <button class="btn-ghost" onclick="togglePanel()">Outline</button>
    <button class="btn-ghost" onclick="toggleFind()">Find</button>
    <button class="btn-ghost" onclick="exportTxt()">Export</button>
    <button class="btn-accent" onclick="copyAll()">Copy</button>
  </div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">

  <!-- Headings -->
  <select class="tool-select" onchange="formatBlock(this.value); this.blur()" title="Heading">
    <option value="p">Paragraph</option>
    <option value="h1">Heading 1</option>
    <option value="h2">Heading 2</option>
    <option value="h3">Heading 3</option>
    <option value="blockquote">Quote</option>
    <option value="pre">Code</option>
  </select>

  <!-- Font size -->
  <select class="tool-select" onchange="setFontSize(this.value); this.blur()" title="Size">
    <option value="">Size</option>
    <option value="1">Small</option>
    <option value="3">Normal</option>
    <option value="5">Large</option>
    <option value="7">Huge</option>
  </select>

  <div class="tool-sep"></div>

  <!-- Bold / Italic / Underline / Strike -->
  <button class="tool-btn" id="btn-bold" onclick="exec('bold')" data-tip="Bold ⌘B">
    <svg viewBox="0 0 24 24"><path d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-3v-3zm3.5 9H10v-3h3.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5z"/></svg>
  </button>
  <button class="tool-btn" id="btn-italic" onclick="exec('italic')" data-tip="Italic ⌘I">
    <svg viewBox="0 0 24 24"><path d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4z"/></svg>
  </button>
  <button class="tool-btn" id="btn-underline" onclick="exec('underline')" data-tip="Underline ⌘U">
    <svg viewBox="0 0 24 24"><path d="M12 17c3.31 0 6-2.69 6-6V3h-2.5v8c0 1.93-1.57 3.5-3.5 3.5S8.5 12.93 8.5 11V3H6v8c0 3.31 2.69 6 6 6zm-7 2v2h14v-2H5z"/></svg>
  </button>
  <button class="tool-btn" id="btn-strikeThrough" onclick="exec('strikeThrough')" data-tip="Strikethrough">
    <svg viewBox="0 0 24 24"><path d="M10 19h4v-3h-4v3zM5 4v3h5v3h4V7h5V4H5zM3 14h18v-2H3v2z"/></svg>
  </button>

  <div class="tool-sep"></div>

  <!-- Align -->
  <button class="tool-btn" id="btn-justifyLeft" onclick="exec('justifyLeft')" data-tip="Align Left">
    <svg viewBox="0 0 24 24"><path d="M15 15H3v2h12v-2zm0-8H3v2h12V7zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z"/></svg>
  </button>
  <button class="tool-btn" id="btn-justifyCenter" onclick="exec('justifyCenter')" data-tip="Center">
    <svg viewBox="0 0 24 24"><path d="M7 15v2h10v-2H7zm-4 6h18v-2H3v2zm0-8h18v-2H3v2zm4-6v2h10V7H7zM3 3v2h18V3H3z"/></svg>
  </button>
  <button class="tool-btn" id="btn-justifyRight" onclick="exec('justifyRight')" data-tip="Align Right">
    <svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm6-4h12v-2H9v2zm-6-4h18v-2H3v2zm6-4h12V7H9v2zM3 3v2h18V3H3z"/></svg>
  </button>
  <button class="tool-btn" id="btn-justifyFull" onclick="exec('justifyFull')" data-tip="Justify">
    <svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm0-4h18v-2H3v2zm0-4h18v-2H3v2zm0-4h18V7H3v2zm0-6v2h18V3H3z"/></svg>
  </button>

  <div class="tool-sep"></div>

  <!-- Lists -->
  <button class="tool-btn" onclick="exec('insertUnorderedList')" data-tip="Bullet List">
    <svg viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg>
  </button>
  <button class="tool-btn" onclick="exec('insertOrderedList')" data-tip="Numbered List">
    <svg viewBox="0 0 24 24"><path d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/></svg>
  </button>
  <button class="tool-btn" onclick="exec('outdent')" data-tip="Outdent">
    <svg viewBox="0 0 24 24"><path d="M11 17h10v-2H11v2zm-8-5l4 4V8l-4 4zm0 9h18v-2H3v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z"/></svg>
  </button>
  <button class="tool-btn" onclick="exec('indent')" data-tip="Indent">
    <svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zM3 8v8l4-4-4-4zm8 9h10v-2H11v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z"/></svg>
  </button>

  <div class="tool-sep"></div>

  <!-- Misc -->
  <button class="tool-btn" onclick="insertLink()" data-tip="Insert Link">
    <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
  </button>
  <button class="tool-btn" onclick="exec('removeFormat')" data-tip="Clear Format">
    <svg viewBox="0 0 24 24"><path d="M3.27 5L2 6.27l6.97 6.97L6.5 19h3l1.57-3.66L16.73 21 18 19.73 3.27 5zM6 5v.18L8.82 8h2.4l-.72 1.68 2.1 2.1L14.21 8H20V5H6z"/></svg>
  </button>
  <button class="tool-btn" onclick="document.execCommand('undo')" data-tip="Undo ⌘Z">
    <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
  </button>
  <button class="tool-btn" onclick="document.execCommand('redo')" data-tip="Redo ⌘⇧Z">
    <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
  </button>

</div>

<!-- MAIN -->
<main>
  <div class="editor-wrap">
    <div
      id="editor"
      contenteditable="true"
      spellcheck="true"
      data-placeholder="Start writing…"
      oninput="onInput()"
      onkeydown="onKeyDown(event)"
      onmouseup="updateToolbar()"
      onkeyup="updateToolbar()"
    ></div>
  </div>

  <!-- OUTLINE PANEL -->
  <div class="panel" id="panel">
    <div class="panel-title">Document Outline</div>
    <div class="panel-body" id="outline-body">
      <div style="color:var(--text-muted);font-size:12px;font-family:'IBM Plex Mono',monospace;">No headings yet.</div>
    </div>
  </div>
</main>

<!-- FIND BAR -->
<div class="find-bar" id="find-bar">
  <div class="find-row">
    <input class="find-input" id="find-input" placeholder="Find…" oninput="doFind()" onkeydown="findKey(event)">
    <span class="find-count" id="find-count">0 / 0</span>
    <button class="btn-ghost" style="padding:4px 8px" onclick="findNext(-1)">↑</button>
    <button class="btn-ghost" style="padding:4px 8px" onclick="findNext(1)">↓</button>
    <button class="btn-ghost" style="padding:4px 8px" onclick="closeFind()">✕</button>
  </div>
  <div class="find-row">
    <input class="find-input" id="replace-input" placeholder="Replace…" onkeydown="replaceKey(event)">
    <button class="btn-ghost" style="padding:4px 8px;font-size:10px" onclick="doReplace()">Replace</button>
    <button class="btn-ghost" style="padding:4px 8px;font-size:10px" onclick="doReplaceAll()">All</button>
  </div>
</div>

<!-- STATUS BAR -->
<div class="statusbar">
  <div class="stat">Words: <span id="stat-words">0</span></div>
  <div class="stat">Chars: <span id="stat-chars">0</span></div>
  <div class="stat">Lines: <span id="stat-lines">0</span></div>
  <div class="stat" id="stat-sel" style="display:none">Selected: <span id="stat-sel-count">0</span></div>
</div>

<script src="node.js"></script>
</body>
</html>
